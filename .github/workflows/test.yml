name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit

  unit:
    name: Unit + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage }

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e -- --project=chromium --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report-${{ matrix.shard }}, path: playwright-report }

  a11y:
    name: Accessibility (pa11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run preview --port 4173 &
      - run: npx wait-on http://localhost:4173
      - run: bunx pa11y-ci --config .pa11yci.json
        continue-on-error: true

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs
        continue-on-error: true

  security:
    name: Security (audit + semgrep + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: bun audit
        run: bun audit || true
      - name: Semgrep OWASP
        uses: returntocorp/semgrep-action@v1
        with: { config: "p/owasp-top-ten p/typescript p/react p/secrets" }
        continue-on-error: true
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  zap-baseline:
    name: OWASP ZAP Baseline (DAST)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.PREVIEW_URL || 'https://example.com' }}
          fail_action: false
